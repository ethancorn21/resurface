<style>
/* Layout (Ethan 2026-10-16, design/one-living-thing applied to the plate palette): the map is the ground, one paper surface
   holds the words, one ink draws everything, survey red marks only the state (the year showing, the overlay), and the year
   scrubber is the page's one living thing. Two desktop layouts, picked on <body>: .lay-card (the panel is one card on the map)
   and .lay-column (a full-height column at the left). Every colour and size is a token, so the dev canvas (?dev=1) reaches it. */
body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
:root {
  /* 2026-10-17 (Ethan: "the tan cream is not that good of a color palette", "more tastefully modern"): cool neutral surfaces,
     one sans face, the survey red kept for the ink and the state. The old plate paper is the dev canvas preset "Plate". */
  --paper: #F2F3F5; --paper-2: #E7E9ED; --sheet: #FFFFFF; --ink: #16181C; --ink-2: #5C616B; --rule: #9AA0AA;
  --hair: #E3E5E9;              /* hairline rules, resting ticks on paper */
  --survey: #CE2E4E;            /* 1848 plate ink, as on the ore bodies of USGS plates: the state colour */
  --space: #0B0D11;             /* round the globe */
  --on-map: #FFFFFF;            /* type and ticks lettered straight on the map */
  --edge: rgba(16, 18, 22, .16);  /* the 1px edge round every surface on the map (a review: "the sidebar has no edge") */
  --lift: 0 12px 32px rgba(6, 8, 12, .3), 0 1px 3px rgba(6, 8, 12, .18);
  --r: 14px; --r-s: 9px;        /* corner radius: surfaces, controls */
  --pin-open: #FFFFFF;          /* the newer, rougher pins are open (white), the older, truer ones solid survey red */
  --halo-a: .6;                 /* how dark the halo round lettering on the map is: a cartographer's halo, not a band or a box */
  --halo: 0 1px 1px rgba(8, 7, 6, calc(var(--halo-a) * 1.1)), 0 0 8px rgba(8, 7, 6, calc(var(--halo-a) * .9)), 0 0 26px rgba(8, 7, 6, calc(var(--halo-a) * .55));
  --halo-f: drop-shadow(0 1px 1px rgba(8, 7, 6, calc(var(--halo-a) * 1.1))) drop-shadow(0 0 7px rgba(8, 7, 6, calc(var(--halo-a) * .8)));
  --scrim-a: .62;               /* the soft shade under the lettering (Ethan 2026-10-16: "add a gradiant behind the text"): eased, no edge */
  --scrim-rgb: 10, 12, 16;
  --on-map-red: color-mix(in srgb, var(--survey) 72%, #fff);  /* the plate red, lifted to read on the shade */
  --mauve: #D8BCD5; --mauve-2: #B996B6; --pink: #F2B5C4; --aqua: #9ED8D8; --sage: #C4D9A6; --lav: #CFC6E0; --ochre: #F2C48D;  /* swatches only */
  --title: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --label: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --title-size: 28px; --card-w: 360px; --col-w: 360px; --float-w: 360px; --gap: 16px;
  --year-size: 64px; --tick-peak: 40px; --tick-base: 7px; --tick-stop: 13px;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--title); overflow: hidden; }
#map { position: fixed; inset: 0; background: var(--space); }
.caps { font-family: var(--label); text-transform: uppercase; letter-spacing: .09em; font-size: 11px; }

/* ---------- the panel: one paper surface, no frame ---------- */
.panel { position: fixed; z-index: 2; display: flex; flex-direction: column; background: var(--sheet); color: var(--ink); }
body.lay-card { --map-left: calc(var(--card-w) + 2 * var(--gap)); }
body.lay-card .panel { top: calc(var(--gap) + env(safe-area-inset-top, 0px)); left: var(--gap); width: var(--card-w); max-height: calc(100% - 2 * var(--gap)); }
body.lay-column { --map-left: var(--col-w); }
body.lay-column .panel { top: 0; left: 0; bottom: 0; width: var(--col-w); border-right: 1px solid var(--hair); }
/* .lay-float (Ethan 2026-10-16: "the year was floating and not carded in ... be radical"): no panel at all. The words are
   lettered straight on the map like a map's own title block, in paper white with a cartographer's halo round each glyph;
   rules and toggles in the same white. The long text folds behind "About this site", and the column fades out at its foot. */
body.lay-float { --map-left: calc(var(--float-w) + 2 * var(--gap)); }
body.lay-float .panel { --ink: var(--on-map); --ink-2: color-mix(in srgb, var(--on-map) 76%, transparent);
  --hair: color-mix(in srgb, var(--on-map) 26%, transparent); --rule: color-mix(in srgb, var(--on-map) 55%, transparent);
  top: calc(var(--gap) + env(safe-area-inset-top, 0px)); left: var(--gap); width: var(--float-w); max-height: calc(100% - 2 * var(--gap));
  background: none; color: var(--on-map); text-shadow: var(--halo);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); }
body.lay-float .panel-head, body.lay-float .panel-body { padding-left: 2px; padding-right: 10px; }
body.lay-float .site-title { font-size: calc(var(--title-size) * 1.6); line-height: 1; letter-spacing: -.01em; }
body.lay-float .site-aka { font-size: 15px; }
body.lay-float .summary { font-size: 15.5px; }
body.lay-float input[type=range]::-webkit-slider-runnable-track, body.lay-float input[type=range]::-webkit-slider-thumb,
body.lay-float input[type=range]::-moz-range-track, body.lay-float input[type=range]::-moz-range-thumb { box-shadow: 0 0 4px rgba(8, 7, 6, .7); }
body.lay-float .tools button { color: var(--on-map); border-color: var(--rule); background: none; }
body.lay-float .tools button.primary { background: var(--on-map); color: #2B2724; text-shadow: none; }
body.lay-float .search input[type=search] { color: var(--on-map); }
body.lay-float .kinds i, body.lay-float .tiers { filter: drop-shadow(0 0 2px rgba(8, 7, 6, .8)); }
body.lay-float .pad button { color: var(--on-map); border-color: var(--rule); }
/* the shade behind the words: a wash off the left edge, eased so it has no edge of its own, over the map and under the panel.
   Desktop only, like the red hints below: on a phone the words sit on the paper sheet. */
@media (min-width: 761px) {
body.lay-float::before { content: ""; position: fixed; z-index: 1; top: 0; bottom: 0; left: 0; width: calc(var(--float-w) + 2 * var(--gap) + 280px); pointer-events: none;
  background: linear-gradient(to right, rgba(var(--scrim-rgb), var(--scrim-a)) 0%, rgba(var(--scrim-rgb), calc(var(--scrim-a) * .94)) 30%,
    rgba(var(--scrim-rgb), calc(var(--scrim-a) * .78)) 46%, rgba(var(--scrim-rgb), calc(var(--scrim-a) * .52)) 60%, rgba(var(--scrim-rgb), calc(var(--scrim-a) * .27)) 74%,
    rgba(var(--scrim-rgb), calc(var(--scrim-a) * .1)) 87%, rgba(var(--scrim-rgb), 0) 100%); }
body.lay-float.blk::before { display: none; }
/* hints of the plate red: the wordmark, the chosen toggle's rule, the fold's label */
body.lay-float .wordmark { color: var(--on-map-red); }
body.lay-float .seg button[aria-pressed="true"], body.lay-float .tabs button[aria-pressed="true"], body.lay-float .kinds button[aria-pressed="true"] { border-bottom-color: var(--on-map-red); }
body.lay-float details.more > summary { color: var(--on-map-red); }
}
details.more > summary { cursor: pointer; font: 600 10.5px var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; } details.more[open] > summary::before { content: "− "; }
details.more[open] > summary { margin-bottom: 14px; }
details.more > :not(summary) + :not(summary) { margin-top: 14px; }
.strip { display: none; }
.panel-head { padding: 18px 22px 0; }
.wordmark { margin: 0; font: 700 12px/1.2 var(--label); letter-spacing: .24em; text-transform: uppercase; }
.wordmark { display: flex; align-items: center; gap: 10px; }
.wordmark .mark { flex: none; width: 36px; height: 24px; color: var(--survey); }  /* the logo: contour rings, brand/logo.js */
body.lay-float .wordmark .mark { color: inherit; filter: var(--halo-f); }
.tagline { margin: 2px 0 0; font: italic 12.5px/1.35 var(--title); color: var(--ink-2); }
.grab { display: none; }
.panel-body { overflow-y: auto; padding: 16px 22px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.section-title { margin: 0; font: 600 10.5px var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }

/* lists: hairline rows */
.legend-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left;
  padding: 9px 0; background: none; border: 0; border-bottom: 1px solid var(--hair); color: inherit; font: inherit; cursor: pointer; }
.entry.srow { grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 12px; }
.entry:hover .name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.entry:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.swatch { width: 34px; height: 22px; border: 1px solid var(--ink); display: block; }
.swatch.plowed { background: var(--sage); } .swatch.standing { background: var(--aqua); } .swatch.urban { background: var(--pink); }
.swatch.hatch { background: repeating-linear-gradient(135deg, var(--paper) 0 3px, var(--ink-2) 3px 4px); }
.entry .name { display: block; font-size: 16px; line-height: 1.25; }
.entry .desc { display: block; font-style: italic; color: var(--ink-2); font-size: 12.5px; line-height: 1.35; }
.entry .yr { font: 600 11px var(--label); letter-spacing: .08em; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }

/* a site: back, title, place, a label/value grid, the paragraph, the credit */
.back { align-self: flex-start; background: none; border: 0; color: var(--ink-2); font: 600 10.5px var(--label); letter-spacing: .16em; text-transform: uppercase; padding: 0; cursor: pointer; }
.back:hover { color: var(--ink); }
.site-head { display: grid; gap: 3px; }
.site-title { margin: 0; font: 400 var(--title-size)/1.08 var(--title); letter-spacing: -.005em; text-wrap: balance; }
.site-aka { margin: 0; font: italic 14px/1.35 var(--title); color: var(--ink-2); }
.facts { margin: 0; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 9px 14px; align-items: baseline; padding: 13px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.facts dt { font: 600 10px/1.6 var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.facts dd { margin: 0; font-size: 14.5px; line-height: 1.35; min-width: 0; }
.facts dd.num { font-variant-numeric: tabular-nums; }
/* toggles are words: the chosen one is ink and underlined, the others mid grey */
.tabs, .seg { display: flex; flex-wrap: wrap; gap: 4px 16px; border: 0; }
.tabs button, .seg button { background: none; border: 0; border-bottom: 1px solid transparent; padding: 1px 0 2px; color: var(--ink-2);
  font: 600 11px/1.3 var(--label); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
.tabs button:hover, .seg button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button:disabled, .seg button:disabled { color: var(--hair); cursor: default; }
.bchips { display: none; }
.group { display: flex; flex-direction: column; gap: 9px; padding-top: 14px; border-top: 1px solid var(--hair); }
.row { display: flex; align-items: center; gap: 12px; }
.row label { flex: 0 0 auto; color: var(--ink-2); font: 600 10px var(--label); letter-spacing: .14em; text-transform: uppercase; }
/* sliders: a hairline and a small ink bead */
input[type=range] { flex: 1; min-width: 0; height: 18px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
input[type=range]::-moz-range-track { height: 1px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%; background: var(--ink); border: 0; }
input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); border: 0; }
.val { font: 600 11px var(--label); color: var(--ink-2); min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.ramp { height: 6px; margin-top: 8px; background: linear-gradient(90deg, #2E2622, #B0A492, #FBF7EC); }
.ramp-labels { display: flex; justify-content: space-between; margin-top: 3px; font: 10.5px var(--label); letter-spacing: .04em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.summary { margin: 0; font-size: 15px; line-height: 1.55; }
.notes { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.fit, .source { margin: 0; font-size: 12px; line-height: 1.45; color: var(--ink-2); font-style: italic; overflow-wrap: anywhere; }
.source a, .about a { color: inherit; }
details.align summary { cursor: pointer; color: var(--ink-2); font: 600 10.5px var(--label); letter-spacing: .14em; text-transform: uppercase; }
.pad { display: grid; grid-template-columns: repeat(3, 38px); gap: 5px; }
.pad button, .tools button { background: none; color: var(--ink); border: 1px solid var(--hair); font: 15px/1 var(--title); height: 32px; cursor: pointer; }
.pad button:hover, .tools button:hover { border-color: var(--ink); }
.tools { display: flex; flex-wrap: wrap; gap: 5px; }
.tools button { padding: 0 10px; font: 600 11px var(--label); letter-spacing: .1em; text-transform: uppercase; }
.tools button.primary { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.status { margin: 0; font-size: 13px; color: var(--ink-2); min-height: 1.4em; }
.search { display: flex; gap: 14px; align-items: center; }
.search input[type=search] { flex: 1; min-width: 0; padding: 6px 0; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent; font: 15px var(--title); color: var(--ink); }
.search input[type=search]::placeholder { color: var(--ink-2); font-style: italic; }
.search input[type=search]:focus-visible { outline: 0; border-bottom-width: 2px; }
.check { display: flex; gap: 6px; align-items: center; font: 600 10px var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.check input { accent-color: var(--ink); margin: 0; }
.group-title { margin: 14px 0 0; padding-bottom: 5px; font: 600 10px var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; }
.group-title span { font-weight: 400; font-variant-numeric: tabular-nums; }
.lede { margin: 0; font-style: italic; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
/* kind filter: words with a flat swatch (the only colour on the panel, and it names a category) */
.kinds { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.kinds button { display: flex; gap: 6px; align-items: center; background: none; border: 0; border-bottom: 1px solid transparent; padding: 1px 0 2px; font: 600 10.5px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
.kinds button:hover { color: var(--ink); }
.kinds button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.kinds i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.swatch.dot { border-radius: 50%; width: 16px; height: 16px; margin: 3px 9px; }
.links { display: flex; gap: 12px; font: 600 12px var(--label); letter-spacing: .06em; text-transform: uppercase; }
.links a { color: var(--ink); }
details.about { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
details.about summary { cursor: pointer; font: 600 10.5px var(--label); letter-spacing: .16em; text-transform: uppercase; }
details.about p { margin: 8px 0 0; }
/* plate-fitting tool: an old book page beside the map, matching points clicked on both */
.fitpane { position: absolute; z-index: 6; top: 12px; bottom: 12px; left: calc(var(--map-left) + 4px); width: min(46vw, 780px); background: var(--sheet); border: 1px solid var(--ink); display: flex; flex-direction: column; box-shadow: 0 2px 12px rgba(43,39,36,.25); }
.fitpane canvas { flex: 1; width: 100%; min-height: 0; cursor: crosshair; touch-action: none; background: var(--paper); display: block; }
.fit-top, .fit-tools { display: flex; gap: 6px; align-items: center; padding: 6px 8px; font: 600 11.5px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.fit-top { border-bottom: 1px solid var(--rule); } .fit-tools { border-top: 1px solid var(--rule); flex-wrap: wrap; }
.fit-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fitpane button { background: var(--sheet); border: 1px solid var(--rule); font: 600 11.5px var(--label); letter-spacing: .05em; padding: 3px 9px; cursor: pointer; color: var(--ink); }
.fitpane button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.fitpane.min { bottom: auto; } .fitpane.min canvas, .fitpane.min .fit-tools { display: none; }
@media (max-width: 760px) { .fitpane { left: 0; right: 0; top: 0; width: auto; bottom: 50vh; } }
.gpin { width: 20px; height: 20px; border-radius: 50%; background: var(--survey); color: #fff; border: 1.5px solid var(--ink); font: 700 11px var(--label); display: flex; align-items: center; justify-content: center; cursor: grab; }
.pairs { margin: 0; padding-left: 20px; display: grid; gap: 2px; font-size: 13.5px; }
.pairs .bad { color: var(--survey); font-weight: 600; }
.plans { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 46vh; overflow: auto; }
.plans button { width: 100%; text-align: left; background: var(--sheet); border: 1px solid var(--rule); padding: 6px 8px; cursor: pointer; color: var(--ink); font: 14px var(--title); }
.plans button:hover { border-color: var(--ink); }
.plans small { display: block; font: 600 11px var(--label); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); margin-top: 2px; }
.step { margin: 0; padding: 7px 9px; border: 1px solid var(--ink); background: var(--paper-2); font-size: 14px; }
.about { display: grid; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.about p { margin: 0; }

/* ---------- finder ---------- */
.known { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; }
.known li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
.known i { color: var(--ink-2); font-size: 12.5px; grid-column: 1 / -1; margin-top: -3px; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; text-decoration: underline dotted var(--rule); }
.linkish[aria-current="true"] { font-weight: 700; color: var(--survey); }
#mnote { width: 100%; box-sizing: border-box; font: 13.5px var(--title); border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 6px; resize: vertical; }
.chip { font: 600 10.5px/1 var(--label); letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px 2px; border: 1px solid var(--ink); white-space: nowrap; background: var(--sheet); color: var(--ink); }
.chip.found, .chip.v-earthwork { background: var(--survey); color: #fff; border-color: var(--survey); }
.chip.missed { background: var(--ink); color: var(--sheet); }
.chip.v-natural { background: var(--sage); } .chip.v-modern { background: var(--mauve); } .chip.v-unsure { background: var(--aqua); }
.chip.todo { color: var(--ink-2); border-style: dashed; }
.cands { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.cand { display: grid; grid-template-columns: 56px 1fr auto; gap: 9px; align-items: center; width: 100%; text-align: left; padding: 4px; background: none; border: 1px solid transparent; color: inherit; font: inherit; cursor: pointer; }
.cand:hover { border-color: var(--rule); background: var(--paper); }
.cand[aria-current="true"] { border-color: var(--ink); background: var(--paper-2); }
.cand img { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--ink); display: block; background: var(--paper-2); }
.cand b { display: block; font-size: 14px; line-height: 1.2; }
.cand small { display: block; font-style: italic; color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.card { display: grid; gap: 9px; padding: 11px 12px; border: 1px solid var(--ink); background: var(--paper); }
.card .crop { position: relative; border: 1px solid var(--ink); background: var(--paper-2); aspect-ratio: 1; }
.card .crop img { width: 100%; height: 100%; display: block; object-fit: contain; }
.card .crop svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.card .stats { margin: 0; font-size: 13px; color: var(--ink-2); font-style: italic; }
.verdicts { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--ink); }
.verdicts button { background: var(--sheet); border: 0; padding: 7px 2px; font: 600 11px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
.verdicts button + button { border-left: 1px solid var(--ink); }
.verdicts button[aria-pressed="true"][data-v="earthwork"] { background: var(--survey); color: #fff; }
.verdicts button[aria-pressed="true"][data-v="natural"] { background: var(--sage); }
.verdicts button[aria-pressed="true"][data-v="modern"] { background: var(--mauve); }
.verdicts button[aria-pressed="true"][data-v="unsure"] { background: var(--aqua); }
.verdicts button:disabled { color: var(--rule); cursor: not-allowed; }
.marker.scan .sq { background: var(--sheet); border-style: dashed; }

/* ---------- markers: map pins, tip on the site's point, each with a pointed street-sign label (Ethan 2026-10-13: the
   notched arrowhead of 2026-10-11 read as a heart; wants a pointer icon and an EU direction-sign label). The .sq span
   holds the pin silhouette (PIN in the script) at the tier's size and colour; Finder search areas (.scan) keep the
   dashed square at the area's corner. */
.marker { display: flex; align-items: center; cursor: pointer; background: none; border: 0; padding: 0; position: absolute; top: 0; left: 0; }
/* only the pin and a showing label take clicks: a hidden label once widened its button, so clicking Old Sarum's
   square from z6 opened Taunton Castle, 90 km west (Ethan 2026-10-10). The flex keeps the button box to its one
   in-flow child (.sq) - the tip-anchored marker below relies on the box being exactly the pin.
   MapLibre parks marker elements at the canvas origin and places them with their inline transform (the vendor css
   does the same: .maplibregl-marker { position: absolute; top: 0; left: 0 }); this restates it explicitly, because a
   flowing position (relative/static) stacks the markers in DOM order and the transform then lands them hundreds to
   thousands of px from their sites (found while doing 308). */
.marker { pointer-events: none; } .marker .sq, .marker .tag { pointer-events: auto; }
.marker.t4 { z-index: 4; } .marker.t3 { z-index: 3; } .marker.t2 { z-index: 2; } .marker.t1 { z-index: 1; }
/* --mks is the tier colour the pin silhouette is painted with (.pin below); the plain background stays for .scan */
.marker .sq { width: 11px; height: 11px; border: 1.5px solid var(--ink); background: var(--survey); --mks: var(--survey); }
/* tiers by score (TIERS in the script): bigger = older overlays that line up with the ground. 2026-10-17 (a review: "age is
   shown as shades of red on tiny pins... you can't tell the shades apart"): size and fill instead of tint. t4/t3 solid
   survey red, t2/t1 open (white), each tier a clear step in size; PIN_W/PIN_H in the script hold the same sizes.
   plain = no overlay 150+ years old (LiDAR or the photograph only), shown only with More sites: small and grey */
.marker.t4 .sq { width: 20px; height: 27px; background: var(--survey); --mks: var(--survey); }
.marker.t3 .sq { width: 15px; height: 21px; background: var(--survey); --mks: var(--survey); }
.marker.t2 .sq { width: 12px; height: 17px; background: var(--pin-open); --mks: var(--pin-open); }
.marker.t1 .sq { width: 10px; height: 14px; background: var(--pin-open); --mks: var(--pin-open); }
.marker.plain .sq { width: 8px; height: 11px; border-width: 1.5px; background: var(--rule); --mks: var(--rule); }
/* the plumb bob: the 72x100 svg scaled to the tier box, filled with the tier colour, one non-scaling ink outline at every
   size (crisp on retina). Must stay after the tier rules above: equal specificity,
   the .pin declarations win by order. */
.marker .sq.pin, .tiers .sq.pin { border: 0; background: none; }
/* a pin the zoom gate or the declutter holds back (syncMarkers sets data-off) goes at once and leaves the hit-test (one living
   thing per page: the scrubber; state changes are instant) */
.marker[data-off] { visibility: hidden; }
.marker[data-off] .sq, .marker[data-off] .tag { opacity: 0; }
.marker .sq.pin svg, .tiers .sq.pin svg { display: block; width: 100%; height: 100%; overflow: visible; }
.marker .sq.pin path, .tiers .sq.pin path { fill: var(--mks, var(--survey)); stroke: #0B0C0E; stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.marker.t4 .tag { font-weight: 700; }
/* the pins read as things to open (Ethan 2026-10-17: "not clear if the markers are clickable"): an invisible hit area round
   each 10-27 px pin (40 px under a finger), and on a mouse the pin lifts and shows its sign. The declutter hides a sign by
   data-tag (syncMarkers), not an inline style, so hovering the pin can bring it back. */
.marker .sq { position: relative; transform-origin: 50% 100%; transition: transform .12s; }
.marker .sq::after { content: ""; position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%); }
@media (pointer: coarse) { .marker .sq::after { width: 40px; height: 40px; } }
.marker[data-tag="off"] .tag { visibility: hidden; }
@media (hover: hover) {
  .marker:hover { z-index: 6; }
  .marker:hover .sq { transform: scale(1.3); }
  .marker:hover .tag { visibility: visible; }
}
.tiers { display: flex; align-items: center; gap: 6px; font: 11.5px var(--label); letter-spacing: .04em; color: var(--ink-2); }
.tiers .sq { display: inline-block; border: 1.5px solid var(--ink); }
.tiers .t4 { width: 20px; height: 27px; --mks: var(--survey); } .tiers .t3 { width: 15px; height: 21px; --mks: var(--survey); }
.tiers .t2 { width: 12px; height: 17px; --mks: var(--pin-open); } .tiers .t1 { width: 10px; height: 14px; --mks: var(--pin-open); }
.tiers .plain { width: 8px; height: 11px; --mks: var(--rule); }
.tiers { align-items: flex-end; } .tiers > span:not(.sq) { align-self: center; margin-left: 4px; }
/* the label is a street sign in the EU direction-sign style (Wegweiser): a box whose left end comes to a point, aimed at
   the pin, centred on the pin's head (36% down its box); the .scan marker has no pin, so its sign is centred on the
   square instead. The ink outline is the sign itself clipped to the pointed shape with the paper face (::before) clipped
   1px inside it, so the point is outlined as evenly as the straight edges; the sign is 20px tall so the point is 45deg. */
.marker .tag { position: absolute; left: 100%; top: 36%; transform: translateY(-50%); margin-left: 3px; box-sizing: border-box; height: 20px; padding: 0 8px 0 15px; line-height: 20px;
  background: var(--ink); clip-path: polygon(0 50%, 10px 0, 100% 0, 100% 100%, 10px 100%);
  font: 600 11px/20px var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.marker .tag::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--sheet);
  clip-path: polygon(1.4px 50%, 10.4px 1px, calc(100% - 1px) 1px, calc(100% - 1px) calc(100% - 1px), 10.4px calc(100% - 1px)); }
.marker.scan .tag { top: 50%; }
.marker .tag small { margin-left: 6px; font: 500 10.5px/20px var(--label); letter-spacing: .02em; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.maplibregl-ctrl-attrib { font: 10.5px var(--label) !important; background: color-mix(in srgb, var(--sheet) 88%, transparent) !important; }
.maplibregl-ctrl-group { background: var(--sheet) !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
.maplibregl-ctrl-group button + button { border-top: 1px solid var(--hair) !important; }

/* ---------- the plate sheet (block diagram) ---------- */
.sheet {
  position: fixed; z-index: 3; top: 0; right: 0; bottom: 0; left: var(--map-left);
  display: grid; grid-template-rows: auto 1fr auto; background: var(--sheet); border-left: 1px solid var(--hair);
}
body.lay-float .sheet { top: var(--gap); right: var(--gap); bottom: var(--gap); left: var(--map-left); border: 0; }
body.lay-card .sheet { top: var(--gap); right: var(--gap); bottom: var(--gap); left: var(--map-left); border: 0; }
.sheet-strip { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 9px 14px 4px; color: var(--ink-2); }
.sheet-close { background: none; border: 0; border-bottom: 1px solid var(--ink); color: var(--ink); font: 600 10.5px var(--label); letter-spacing: .14em; text-transform: uppercase; padding: 2px 0; cursor: pointer; }
.sheet-close:hover { color: var(--ink-2); }
.sheet-main { position: relative; display: grid; grid-template-columns: 1fr 230px; min-height: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 14px; }
.stage { position: relative; min-height: 0; min-width: 0; cursor: grab; touch-action: none; }
.stage:active { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.compass { position: absolute; left: 14px; bottom: 14px; width: 54px; height: 54px; pointer-events: none; }
.hint { position: absolute; right: 12px; bottom: 10px; font: 11px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-style: italic; color: var(--ink-2); }
.explain { border-left: 1px solid var(--rule); padding: 12px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.explain .section-title { margin-bottom: 2px; }
.key { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; font-size: 12.5px; line-height: 1.3; }
.key .swatch { width: 30px; height: 18px; }
.key b { display: block; font-size: 13px; }
.key i { color: var(--ink-2); }
.toggle { display: flex; gap: 8px; align-items: center; font: 12px var(--label); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.toggle input { accent-color: var(--ink); width: 16px; height: 16px; }
.caption { padding: 8px 14px 10px; text-align: center; }
.caption h2 { margin: 0; font: 400 15px/1.3 var(--title); letter-spacing: .14em; text-transform: uppercase; text-wrap: balance; }
.caption p { margin: 3px 0 0; font: italic 12.5px var(--title); color: var(--ink-2); }

/* ---------- phones: map first (Ethan 2026-10-15: "the map should take up way more of the screen"; past and present lenses).
   The panel is a bottom sheet that rests at its peek (--peek, set by the script from the view's [data-peek] part) and pulls up
   to 84%; the desktop header goes, a floating bar carries back and the site name. In a site the peek is the lens bar: one
   slider from the oldest overlay to today (crossfading in date order), Aerial / LiDAR / 3D block / Nearby, and the past button
   above the sheet: tap for ink lines or the original drawing, hold and slide for its opacity. */
.mtop, .mera, .mpop { display: none; }
.lensbar { display: none; }
/* ---------- the year scrubber: the page's one living thing (design/one-living-thing, "The Life of a Cursor"): a ruler of 1px
   ticks, one even slot per old map, swelling round the current point; the big year counts between maps as it slides; the
   name below it; the oldest year at the left end, Today at the right. Desktop: lettered straight on the map, big, with the
   cartographer's halo round the numerals, the name and every tick (no band, no card; Ethan 2026-10-16). Phones: the same
   parts in the sheet's peek. */
.yscrub { position: fixed; z-index: 2; left: var(--map-left); right: 0; bottom: 44px; display: flex; justify-content: center; padding: 0 40px; pointer-events: none; }
.yscrub[hidden] { display: none; }
body.blk .yscrub { display: none; }  /* the block's caption sits where the year would; scrub on the map */
.yscrub .ys { pointer-events: auto; width: min(640px, 100%);
  --ys-text: var(--on-map); --ys-text-2: var(--on-map); --tk: color-mix(in srgb, var(--on-map) 62%, transparent); --tk-stop: var(--on-map); --tk-on: var(--survey); }
.yscrub .ys { position: relative; isolation: isolate; }
/* the same shade under the year: an ellipse that dies out before it reaches anything, never a band */
.yscrub .ys::before { content: ""; position: absolute; z-index: -1; inset: -90px -150px -60px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--scrim-rgb), var(--scrim-a)) 0%, rgba(var(--scrim-rgb), calc(var(--scrim-a) * .9)) 35%,
    rgba(var(--scrim-rgb), calc(var(--scrim-a) * .6)) 58%, rgba(var(--scrim-rgb), calc(var(--scrim-a) * .28)) 78%, rgba(var(--scrim-rgb), 0) 100%); }
.yscrub .ys-head { text-shadow: var(--halo); }
.yscrub .ys-row { filter: var(--halo-f); }
.ys { --ys-text: var(--ink); --ys-text-2: var(--ink-2); --tk: var(--hair); --tk-stop: var(--ink-2); --tk-on: var(--survey);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; touch-action: none; user-select: none; -webkit-user-select: none; }  /* minmax: a long map name ellipsizes instead of widening the ruler past the screen */
.ys-head { display: grid; justify-items: center; gap: 2px; text-align: center; color: var(--ys-text); }
.ys-year { font: 400 var(--year-size)/.95 var(--title); font-variant-numeric: tabular-nums; letter-spacing: -.015em; }
.ys-name { max-width: 100%; font: italic 17px/1.3 var(--title); color: var(--ys-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ys-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 16px; align-items: end; }
.ys-ticks { position: relative; height: var(--tick-peak); cursor: ew-resize; touch-action: none; outline: none; }
.ys-ticks:focus-visible { outline: 1px solid var(--ys-text-2); outline-offset: 6px; }
.ys-tk { position: absolute; bottom: 0; width: 1px; height: var(--tick-peak); background: var(--tk); transform-origin: 50% 100%; transform: scaleY(calc(var(--tick-base) / var(--tick-peak))); will-change: transform; }
.ys-tk.st { background: var(--tk-stop); }
.ys-tk.on { background: var(--tk-on); width: 2px; margin-left: -.5px; }
.ys-ticks.present .ys-tk.on { background: var(--tk-stop); }
.ys-end { background: none; border: 0; padding: 4px 0; font: 600 11px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; font-variant-numeric: tabular-nums; color: var(--ys-text-2); cursor: pointer; white-space: nowrap; }
.ys .ys-end:hover { text-decoration: underline; text-underline-offset: 3px; }
/* ---------- 2026-10-17 modern pass (Ethan: "change the aesthetics... more tastefully modern"; a review he sent: "the sidebar
   has no edge. The navy panel sits on a navy ocean... give it a clearly different value and a 1px border"). One sans face, no
   italics, controls in sentence case as pills (filters) and segmented switches (views); every surface on the map (the panel,
   the zoom buttons, the block sheet, the credits) is white with a 1px edge and a soft lift, so it reads off ocean and aerial
   alike. The big year still floats on the map. */
body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
.tagline, .entry .desc, .site-aka, .fit, .source, .lede, .ys-name, .search input[type=search]::placeholder, .mt-name i,
.mpop .mp-t span, .track-none, .loading, .caption p, .key i, .status { font-style: normal; }
body.lay-card .panel { border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--lift); overflow: hidden; }
body.lay-column .panel { border-right: 1px solid var(--edge); box-shadow: var(--lift); }
body.lay-card .sheet { border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--lift); overflow: hidden; }
.panel-head { padding: 18px 20px 0; }
.panel-body { padding: 14px 20px 20px; }
.wordmark { font: 700 13px/1.2 var(--label); letter-spacing: .14em; color: var(--ink); }
.tagline { margin-top: 3px; font: 400 13px/1.4 var(--title); }
.lede { font-size: 14px; line-height: 1.5; }
/* eyebrow labels: small caps-height, semibold, a little tracking */
.section-title, .facts dt, .group-title { font: 600 11px/1.4 var(--label); letter-spacing: .06em; }
.group-title { margin-top: 18px; padding-bottom: 4px; border-bottom: 1px solid var(--hair); }
.back, details.more > summary, details.about summary, details.align summary, .check, .row label { font: 500 13px var(--label); letter-spacing: 0; text-transform: none; }
.back { padding: 2px 0; }
.check input { width: 15px; height: 15px; }
/* lists: rows that light up, no rules between them */
.entry { border-bottom: 0; border-radius: var(--r-s); padding: 9px 10px; margin: 0 -10px; width: calc(100% + 20px); }
.entry:hover { background: var(--paper); }
.entry:hover .name { text-decoration: none; }
.entry .name { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.entry .desc { font-size: 12.5px; margin-top: 1px; }
.entry .yr { font: 500 12.5px var(--label); letter-spacing: 0; }
/* the kind filter: pills, the chosen one filled */
.kinds { gap: 6px; }
.kinds button { padding: 7px 11px; border: 1px solid var(--hair); border-radius: 999px; background: var(--sheet); color: var(--ink);
  font: 500 12.5px/1 var(--label); letter-spacing: 0; text-transform: none; white-space: nowrap; }
.kinds button:hover { border-color: var(--rule); }
.kinds button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.tiers { font: 400 12.5px var(--label); letter-spacing: 0; }
.search input[type=search] { padding: 9px 12px; border: 1px solid transparent; border-radius: var(--r-s); background: var(--paper); font: 400 14.5px var(--title); }
.search input[type=search]:focus-visible { border: 1px solid var(--rule); background: var(--sheet); }
/* a site */
.site-title { font: 650 var(--title-size)/1.1 var(--title); letter-spacing: -.02em; }
.site-aka { font-size: 13.5px; }
.facts { grid-template-columns: 70px minmax(0, 1fr); gap: 12px 14px; align-items: center; }
.facts dd { font-size: 14px; }
.facts dd.num { font-weight: 600; }
/* views: segmented switches */
.tabs, .seg { display: inline-flex; flex-wrap: nowrap; gap: 2px; padding: 2px; background: var(--paper-2); border-radius: var(--r-s); max-width: 100%; vertical-align: middle; }
.tabs button, .seg button { padding: 6px 12px; border: 0; border-radius: 7px; color: var(--ink-2); font: 500 12.5px/1 var(--label); letter-spacing: 0; text-transform: none; }
.tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 18, 22, .16), 0 0 0 .5px rgba(16, 18, 22, .08); }
.tabs button:disabled, .seg button:disabled { color: var(--rule); }
/* sliders: a rounded track and a white knob */
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--hair); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--hair); }
input[type=range]::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -7px; background: var(--sheet); border: 1px solid var(--rule); box-shadow: 0 1px 3px rgba(16, 18, 22, .25); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; background: var(--sheet); border: 1px solid var(--rule); box-shadow: 0 1px 3px rgba(16, 18, 22, .25); }
input[type=range] { height: 22px; }
.val { font: 500 12.5px var(--label); letter-spacing: 0; color: var(--ink); }
.pad button, .tools button { border-radius: 8px; }
.tools button { font: 500 12.5px var(--label); letter-spacing: 0; text-transform: none; }
/* on the map */
.marker .tag { font-weight: 600; letter-spacing: .04em; }
.maplibregl-ctrl-group { border: 1px solid var(--edge) !important; border-radius: var(--r-s) !important; box-shadow: var(--lift) !important; overflow: hidden; }
.maplibregl-ctrl-attrib { border-radius: 6px; }
.ys-year { font-weight: 600; letter-spacing: -.035em; }
.ys-name { font-size: 15px; font-weight: 500; }
.ys-end { font: 600 11px/1 var(--label); letter-spacing: .06em; }
.sheet-close { border: 1px solid var(--hair); border-radius: 999px; padding: 6px 12px; text-transform: none; letter-spacing: 0; font: 500 12.5px var(--label); }
@media (max-width: 760px) {
  :root { --peek: 40vh; }
  /* the layouts' desktop placement goes; the sheet's own transform stays on .panel so .panel.open still wins */
  body.lay-card .panel, body.lay-column .panel, body.lay-float .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: none; border: 0;
    background: var(--sheet); color: var(--ink); text-shadow: none; -webkit-mask-image: none; mask-image: none; }
  body.lay-float .panel { --ink: #16181C; --ink-2: #5C616B; --hair: #E3E5E9; --rule: #9AA0AA; }  /* :root's values (the float panel re-inks for the map) */
  body.lay-float .site-title { font-size: var(--title-size); }
  body.lay-float .panel-body { padding: 2px 22px 22px; }
  .panel { height: 84%; padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden;
    transform: translateY(calc(100% - var(--peek))); transition: transform .34s cubic-bezier(.2, .8, .2, 1); }
  .panel.open { transform: none; }
  .panel.dragging { transition: none; }
  .panel:not(.open) { touch-action: none; }
  .panel:not(.open) .panel-body { overflow: hidden; }
  .strip, .panel-head { display: none; }
  .grab { display: block; flex: none; width: 100%; height: 24px; background: none; border: 0; padding: 0; cursor: pointer; touch-action: none; }
  .grab::before { content: ""; display: block; margin: 8px auto 0; width: 44px; height: 5px; background: var(--rule); }
  .panel-body { padding: 2px 18px 18px; }
  /* in a site the lens bar carries view, ground and the old map's look, so the card's rows for them go */
  #body > .back, .lensbar ~ .facts .f-view, .lensbar ~ .facts .f-ground, .lensbar ~ .facts .f-look { display: none; }
  #body > .search { order: -2; touch-action: none; } #body > .tabs { order: -1; }
  /* pulled up in a site: what it is and where to go next first, the map pickers and the owner's tools under them */
  #body > .lensbar ~ .facts, #body > .lensbar ~ .summary, #body > .lensbar ~ p.source, #body > .lensbar ~ div:has(> .notes), #near { order: 1; }
  #body > .lensbar ~ .group, #body > .lensbar ~ details.align { order: 2; }
  .search input[type=search] { font-size: 16px; padding: 9px 0; }  /* 16px: iOS zooms the page into smaller inputs */
  .maplibregl-ctrl-top-right { display: none; }
  .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom: var(--peek); transition: bottom .34s; }

  /* the top bar is one plate label: back on its left behind a rule, the site's name centred in the rest, the year hung
     under the name's centre (Ethan 2026-10-15: the year sat off-centre, the back box felt detached). Home shows no bar. */
  .mtop { display: flex; position: fixed; z-index: 2; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top, 0px)); align-items: stretch;
    background: var(--sheet); }
  /* home (Ethan 2026-10-17: "not immediately clear what the purpose of the site is"; a phone showed a globe and a search box):
     the bar carries the wordmark and the tagline, no back button, and the lede rides in the sheet's peek above the search */
  .mtop.home .mt-back { display: none; }
  .mtop.home .mt-name { padding: 8px 12px; }
  .mt-brand { display: flex !important; justify-content: center; align-items: center; gap: 8px; color: var(--survey);
    font: 700 12px/1.2 var(--label) !important; letter-spacing: .24em; text-transform: uppercase; }
  .mt-brand .mark { flex: none; width: 30px; height: 20px; }
  #body > .lede { order: -3; margin-bottom: 4px; }
  .mt-back { flex: none; width: 46px; display: grid; place-items: center; background: none; border: 0; border-right: 1px solid var(--hair); color: var(--ink); cursor: pointer; padding: 0; }
  .mt-back svg { width: 22px; height: 22px; }
  .mt-back:active { background: var(--paper-2); }
  .mt-name { position: relative; flex: 1; min-width: 0; text-align: center; padding: 6px 46px 6px 0; }  /* right pad = back's width, so the name centres on the screen */
  .mt-name b { display: block; font: 400 17px/1.2 var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt-name i { display: block; font: italic 12px/1.3 var(--title); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mera { position: absolute; left: calc(50% - 23px); top: calc(100% + 9px); transform: translateX(-50%); pointer-events: none;
    font: 700 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; background: var(--survey); color: #fff; padding: 5px 8px 4px; white-space: nowrap; }
  .mera:not([hidden]) { display: block; }
  .mera.present { background: var(--ink); }

  /* the old map's look: a chip in the lens bar's row opens a small card with Ink lines / Original and an opacity slider
     (replaced the round tap-or-hold button: "nothing indicates the button can be pressed") */
  .mpop { position: fixed; z-index: 3; right: 12px; bottom: calc(var(--peek) + 8px); width: min(300px, calc(100vw - 24px)); box-sizing: border-box;
    background: var(--sheet); padding: 12px 14px 14px; display: grid; gap: 12px; }
  .mpop[hidden] { display: none; }
  .mpop .mp-t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .mpop .mp-t b { font: 600 10.5px var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .mpop .mp-t span { font: italic 12px/1.2 var(--title); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .mp-seg { display: flex; gap: 18px; }
  .mp-seg button { background: none; border: 0; border-bottom: 1px solid transparent; padding: 8px 0 3px; font: 600 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
  .mp-seg button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .mp-seg button:disabled { color: var(--hair); cursor: default; }
  .mp-op { display: flex; align-items: center; gap: 10px; }
  .mp-op label { font: 600 10.5px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .mp-op input { flex: 1; min-width: 0; height: 30px; }
  .mp-op output { font: 700 12.5px var(--label); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
  .panel.open ~ .mpop { display: none; }

  .lensbar { flex: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-height: 104px; align-content: start; touch-action: none; }  /* flex: none: the peek is its full height */
  .yscrub { display: none !important; }
  /* the year scrubber in the peek: year and name on one line, the ends either side of the ticks */
  .ys { gap: 5px; }
  .ys-head { display: flex; align-items: baseline; gap: 10px; justify-items: start; text-align: left; min-height: 24px; }
  .ys-year { font-size: 24px; line-height: 1.1; flex: none; }
  .ys-name { flex: 1; min-width: 0; font-size: 13.5px; }
  .ys-row { gap: 0 12px; }
  .ys-end { padding: 8px 0; font-size: 10.5px; }
  .track-none { margin: 0; min-height: 44px; display: flex; align-items: center; font-size: 13px; font-style: italic; color: var(--ink-2); }
  .lrow { display: flex; gap: 8px; align-items: center; }
  /* the lens row: words, the chosen ones ink and underlined; the old map's look at the right with a caret, as the thing that opens */
  .lchips { display: flex; gap: 18px; flex: 1; min-width: 0; align-items: center; border-top: 1px solid var(--hair); padding-top: 4px; }
  .lchips button { flex: none; min-width: 0; white-space: nowrap; background: none; border: 0; border-bottom: 1px solid transparent; color: var(--ink-2); font: 600 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; padding: 11px 0 4px; cursor: pointer; }
  .lchips .gap { flex: 1; }
  .lchips button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .lchips .lpast { color: var(--ink); display: flex; align-items: center; gap: 5px; }
  .lchips .lpast::after { content: ""; flex: none; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 5px solid currentColor; }
  .lchips .lpast[aria-expanded="true"] { border-bottom-color: var(--ink); }
  .lchips .lpast:disabled { color: var(--hair); cursor: default; }
  .lchips .lpast b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .strip { padding-top: 14px; }
  /* the block on a phone (Ethan 2026-10-15: "the block view needs to be fixed as well"): the block fills the screen above the
     sheet's peek, the lens bar stays under it (the drape follows it), the floating bar takes you back; the explanation is a
     Key the block's chips open, the caption goes */
  /* the layouts' desktop placement (body.lay-* .sheet: left past the panel, 20px gaps) outranks a bare .sheet and left the
     block 0 px wide on a phone (--map-left 400px on a 390px screen); restated with the same weight, as for .panel above */
  .sheet, body.lay-card .sheet, body.lay-column .sheet, body.lay-float .sheet { left: 0; right: 0; top: 0; bottom: var(--peek); outline: none; border: 0; box-shadow: none; grid-template-rows: 1fr; background: var(--paper); transition: bottom .34s; }
  .sheet-strip, .caption { display: none; }
  .sheet-main { display: block; margin: 0; border: 0; }
  .stage { position: absolute; inset: 0; }
  .explain { display: none; position: absolute; z-index: 2; left: 10px; right: 10px; top: calc(112px + env(safe-area-inset-top, 0px)); max-height: 55%;
    background: color-mix(in srgb, var(--sheet) 97%, transparent); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--lift); }
  .sheet.keyopen .explain { display: flex; }
  .bchips { display: flex; position: absolute; z-index: 2; right: 10px; top: calc(66px + env(safe-area-inset-top, 0px)); gap: 6px; }
  .bchips button { background: color-mix(in srgb, var(--sheet) 94%, transparent); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink); font: 600 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; padding: 8px 10px; cursor: pointer; }
  .bchips button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
  .hint { bottom: 8px; right: 10px; }
  .compass { bottom: 10px; left: 10px; width: 44px; height: 44px; }
  body.blk .panel, body.blk .mtop, body.blk .mpop { z-index: 4; }
  body.blk .mera { display: none; }
}
/* ---------- phones, 2026-10-17 modern pass: the sheet is a rounded white surface with an edge; at home the kind pills ride in
   the peek in one sideways row; in a site the view switches (Aerial, LiDAR, 3D, the old map's look) are pills at the top of
   the peek, above the year scrubber, so nothing that changes the view needs a scroll to reach. */
@media (max-width: 760px) {
  body.lay-card .panel, body.lay-column .panel, body.lay-float .panel { border-top: 1px solid var(--edge); border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 28px rgba(6, 8, 12, .22); }
  .grab::before { width: 38px; height: 5px; border-radius: 3px; background: var(--hair); }
  .lede { font-size: 13.5px; line-height: 1.45; }
  #body > .kinds { order: -1; flex: none; flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px; padding: 2px 18px 4px; scrollbar-width: none; touch-action: pan-x; }
  #body > .kinds::-webkit-scrollbar { display: none; }
  .kinds button { flex: none; padding: 9px 13px; font-size: 13.5px; }
  .search input[type=search] { padding: 10px 12px; }
  .mtop { border: 1px solid var(--edge); border-radius: 12px; box-shadow: var(--lift); overflow: hidden; }
  .mt-name b { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .mt-name i { font-style: normal; }
  .mt-brand { color: var(--ink); letter-spacing: .14em; }
  .mt-brand .mark { color: var(--survey); }
  .mera { border-radius: 6px; }
  .mpop { border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--lift); }
  .mpop .mp-t b { font: 600 11px var(--label); letter-spacing: .06em; }
  .mp-seg { gap: 2px; padding: 2px; background: var(--paper-2); border-radius: var(--r-s); width: max-content; }
  .mp-seg button { padding: 8px 14px; border: 0; border-radius: 7px; font: 500 13px/1 var(--label); letter-spacing: 0; text-transform: none; }
  .mp-seg button[aria-pressed="true"] { background: var(--sheet); box-shadow: 0 1px 2px rgba(16, 18, 22, .16); }
  .mp-op label { font: 500 13px var(--label); letter-spacing: 0; text-transform: none; }
  .lensbar { gap: 10px; }
  .lchips { gap: 6px; border-top: 0; padding-top: 0; }
  .lchips button { padding: 9px 13px; border: 1px solid var(--hair); border-radius: 999px; background: var(--sheet); color: var(--ink);
    font: 500 13.5px/1 var(--label); letter-spacing: 0; text-transform: none; }
  .lchips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
  .lchips .lpast { border-color: var(--survey); color: var(--survey); }
  .lchips .lpast[aria-expanded="true"] { background: var(--survey); color: #fff; border-color: var(--survey); }
  .lchips .lpast:disabled { border-color: var(--hair); color: var(--rule); }
  .lchips .gap { flex: 1 1 0; min-width: 0; }
  .ys-year { font-size: 24px; }
  .ys-name { font-size: 13.5px; }
  .bchips button { padding: 8px 12px; text-transform: none; letter-spacing: 0; font: 500 13px/1 var(--label); }
}

// come from PMTiles archives (read by HTTP range requests, pmtiles JS) split by area to fit the uploader; config.js
// gives the URL of their index (reliefTiles), which names the archive holding each area cell (a z8-z10 tile).

  maplibregl.addProtocol('relief', async (params, abort) => {
    const [z, x, y] = params.url.split('/').slice(-3).map(Number);
    const ix = await index;
    let file = null;
    for (const L of ix.levels) {
      if (z < L) break;
      file = ix.cells[`${L}/${x >> (z - L)}/${y >> (z - L)}`] || file;
    }
    if (!file) return { data: null };  // no relief rendered here (as the live server's transparent tile)
    if (!archives.has(file)) archives.set(file, new pmtiles.PMTiles(new URL(file, RELIEF_PM).href));
    const t = await archives.get(file).getZxy(z, x, y, abort.signal);

// the old maps' ink lines (Ethan 2026-10-17: "on a phone the ink is hard to see"; a review: "red ink on green fields fails for
// colorblind viewers"). The crimson matches the fields' brightness (design/survey-red-ink.md: contrast ~1.5, hue alone), and
// most line pixels sat at 40-60% alpha before the layer's own opacity. Every ink image is loaded through ink:// instead: line
// strength is raised (faint grain below ~12% drops out, anything past ~57% is full ink), and a dark outline about a screen
// pixel and a half wide goes under the red lines (not under the faint hatching and grain, which would darken the whole sheet), so they stand off any ground. Cached per image: the scrubber and the

// work happens off the page's thread and a flight or a scrub does not stall while it runs. scr: the screen's long side in
// device pixels
function inkProcess(bmp, scr) {
  const INK_HALO = [14, 12, 12], INK_HALO_A = 0.6, INK_LINE = 0.6;  // INK_LINE: only ink this strong gets the outline
  const w = bmp.width, h = bmp.height, c = new OffscreenCanvas(w, h), g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(bmp, 0, 0);
  const im = g.getImageData(0, 0, w, h), d = im.data, n = w * h, a = new Float32Array(n);

  // outline radius in sheet pixels: ~1.4 screen pixels at the size a site opens at (about a screen across)
  const r = Math.max(1, Math.min(3, Math.round(1.4 * Math.max(w, h) / scr)));

  const p = $('#b-plate'); if (p) p.onchange = e => { B.plate = e.target.checked; applyPlate(); };
  $('#b-gap').onchange = e => { B.gap = e.target.checked ? 1 : 0; applyGap(); renderExplain(s, ve); };
}
function resizeBlock() {
  if (!B.renderer) return;
  const st = $('#stage'), w = Math.max(1, st.clientWidth), h = Math.max(1, st.clientHeight);
  B.renderer.setSize(w, h, false);
  B.aspect = w / h; B.dirty = true;
}
addEventListener('resize', () => { if (B.open) resizeBlock(); });
function placeCamera() {
  const r = B.radius * 4, c = B.center;
  B.camera.position.set(c.x + r * Math.cos(B.el) * Math.cos(B.az), c.y + r * Math.sin(B.el), c.z + r * Math.cos(B.el) * Math.sin(B.az));
  B.camera.lookAt(c);
  const half = B.radius * 1.02 / B.zoom;
  B.camera.left = -half * Math.max(1, B.aspect); B.camera.right = half * Math.max(1, B.aspect);
  B.camera.top = half / Math.min(1, B.aspect); B.camera.bottom = -half / Math.min(1, B.aspect);
  B.camera.updateProjectionMatrix();
  B.camera.updateMatrixWorld();

  const o = c.clone().project(B.camera), n = c.clone().add(new THREE.Vector3(0, 0, -100)).project(B.camera);
  const sx = (n.x - o.x) * B.aspect, sy = n.y - o.y;  // NDC -> screen-proportional, y up
  $('#needle').setAttribute('transform', `rotate(${Math.atan2(sx, sy) * 180 / Math.PI})`);
}
function loop() {
  if (!B.open) return;
  if (B.dirty && B.scene) { placeCamera(); B.renderer.render(B.scene, B.camera); B.dirty = false; }
  B.raf = requestAnimationFrame(loop);
}
function bindControls() {
  const el = $('#stage'), pts = new Map(); let pinch = 0;
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const [px, py] = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch) B.zoom = Math.min(8, Math.max(0.6, B.zoom * d / pinch));
      pinch = d;
    } else {
      B.az += (e.clientX - px) * 0.008;
      B.el = Math.min(1.45, Math.max(0.12, B.el + (e.clientY - py) * 0.006));
    }
    B.dirty = true;
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e => { e.preventDefault(); B.zoom = Math.min(8, Math.max(0.6, B.zoom * Math.exp(-e.deltaY * 0.0015))); B.dirty = true; }, { passive: false });
}

/* ---------- document store on the local server (same shape as the old artifact db) ---------- */
async function openDb() {
  // the public copy has no server: the saved plate and drawing positions come from a read-only snapshot the export
  // writes (tools/export_public.py, data/align.json: { plates: {id: {...}}, depalign: {...} }), and nothing saves
  if (PUBLIC) {
    const snap = await fetch('data/align.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
    return { readOnly: true, collection: name => ({
      async get() { return { docs: Object.entries(snap[name] || {}).map(([id, d]) => ({ id, data: () => d })) }; } }) };
  }
  const url = p => 'api/db/' + p.split('/').map(encodeURIComponent).join('/');
  try { if (!(await fetch(url('ping'))).ok) return null; } catch { return null; }
  return {
    doc: path => ({
      async get() {
        const r = await fetch(url(path));
        if (r.status === 404) return { exists: false, data: () => undefined };
        if (!r.ok) throw new Error(`db get ${r.status}`);
        const d = await r.json();
        return { exists: true, data: () => d };
      },
      async set(data) {
        const r = await fetch(url(path), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        if (!r.ok) throw new Error(`db set ${r.status}`);
      },
      async delete() {
        const r = await fetch(url(path), { method: 'DELETE' });
        if (!r.ok && r.status !== 404) throw new Error(`db delete ${r.status}`);
      },
    }),
    collection: name => ({
      async get() {
        const r = await fetch(url(name));
        if (!r.ok) throw new Error(`db list ${r.status}`);
        const { docs } = await r.json();
        return { docs: docs.map(d => ({ id: d.id, data: () => d.data })) };
      },
    }),
  };
}

/* ---------- finder: Amazon forest LiDAR, looked at by eye ---------- */
// Ethan 2026-10-10: eye review of the Brazilian Forest Service concession LiDAR (pipeline/amazon_sfb.py). The relief tiles,
// the index and the marks are gitignored and served only on the LAN: the SFB data are for research and education, never
// published. A mark is a spot Ethan wants to remember, with a verdict; nothing here is a find.
const A = { areas: [], byName: {}, sel: null, survey: null, mark: null, marks: {}, seen: {} };
const seenKey = (area, sid) => `${area}.${sid}`;
const areaSeen = a => a.surveys.filter(v => A.seen[seenKey(a.name, v.id)]).length;
const areaMarks = name => Object.entries(A.marks).filter(([, m]) => m.area === name).map(([id, m]) => ({ id, ...m }));
function markFeatures() {
  return { type: 'FeatureCollection', features: Object.entries(A.marks).map(([id, m]) => ({ type: 'Feature',
    properties: { id, v: m.v, sel: id === A.mark ? 1 : 0 }, geometry: { type: 'Point', coordinates: [m.lon, m.lat] } })) };
}
function refreshMarks() { const src = map.getSource('amazon-marks'); if (src) src.setData(markFeatures()); }
function addArea(a) {
  if (map.getSource(`amazon-${a.name}`)) return;
  const [x0, y0, x1, y1] = a.bounds;
  map.addSource(`amazon-${a.name}`, { type: 'raster', tiles: [a.tiles], tileSize: 256, minzoom: a.minzoom, maxzoom: a.maxzoom, bounds: a.bounds,
    attribution: 'LiDAR: Brazilian Forest Service (SFB), via Fischer et al.' });
  map.addLayer({ id: `amazon-${a.name}`, type: 'raster', source: `amazon-${a.name}`, minzoom: a.minzoom - 0.5, paint: { 'raster-fade-duration': 0 } });
  map.addSource(`amazon-${a.name}-surveys`, { type: 'geojson', data: { type: 'FeatureCollection', features: a.surveys.map(v => ({ type: 'Feature',
    properties: { id: v.id }, geometry: { type: 'LineString', coordinates: v.outline } })) } });
  map.addLayer({ id: `amazon-${a.name}-surveys`, type: 'line', source: `amazon-${a.name}-surveys`,
    paint: { 'line-color': ['case', ['==', ['get', 'id'], A.survey || ''], '#CE2E4E', '#2B2724'], 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1.2, 15, 2], 'line-dasharray': [3, 2] } });
  if (!map.getSource('amazon-marks')) {
    map.addSource('amazon-marks', { type: 'geojson', data: markFeatures() });
    map.addLayer({ id: 'amazon-marks', type: 'circle', source: 'amazon-marks', paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 16, 9], 'circle-color': VCOLOR, 'circle-opacity': 0.9,
      'circle-stroke-color': ['case', ['==', ['get', 'sel'], 1], '#F8F4E8', '#2B2724'], 'circle-stroke-width': ['case', ['==', ['get', 'sel'], 1], 3, 1.2] } });
    map.on('mouseenter', 'amazon-marks', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'amazon-marks', () => map.getCanvas().style.cursor = '');
  }
}
function areaPad() { return narrow() ? sheetPad() : { left: 400, top: 30, right: 30, bottom: 30 }; }
function selectArea(name) {
  const a = A.byName[name]; if (!a) return;
  closeBlock(); S.sel = null; syncMarkers(); F.sel = null; F.cand = null; A.sel = name; A.mark = null;
  addArea(a); renderArea(name);
  if (narrow()) sheetOpen(false);
  const [x0, y0, x1, y1] = a.bounds;
  map.fitBounds([[x0, y0], [x1, y1]], { padding: areaPad(), duration: 3500 });
  try { history.replaceState(null, '', '#amazon-' + name); } catch {}
}
function selectSurvey(name, sid) {
  const v = A.byName[name].surveys.find(x => x.id === sid); if (!v) return;
  A.survey = sid; A.mark = null; refreshMarks();
  map.setPaintProperty(`amazon-${name}-surveys`, 'line-color', ['case', ['==', ['get', 'id'], sid], '#CE2E4E', '#2B2724']);
  const [x0, y0, x1, y1] = v.bounds;
  map.fitBounds([[x0, y0], [x1, y1]], { padding: areaPad(), duration: 1800, maxZoom: 16 });
  renderArea(name);
}
function nextSurvey(name) {
  const list = A.byName[name].surveys, i = list.findIndex(v => v.id === A.survey);
  for (let j = 1; j <= list.length; j++) { const v = list[(i + j + list.length) % list.length]; if (!A.seen[seenKey(name, v.id)]) return selectSurvey(name, v.id); }
}
async function toggleSeen(name, sid) {
  const k = seenKey(name, sid), was = A.seen[k];
  if (was) delete A.seen[k]; else A.seen[k] = { at: new Date().toISOString() };
  renderArea(name);
  try { if (was) await S.db.doc(`surveyseen/${k}`).delete(); else await S.db.doc(`surveyseen/${k}`).set(A.seen[k]); }
  catch (e) { if (was) A.seen[k] = was; else delete A.seen[k]; renderArea(name); $('#asaved').textContent = `Could not save (${e && e.message || 'error'}).`; }
}
async function addMark(name, lngLat) {
  const id = `${name}-${Date.now().toString(36)}`;
  A.marks[id] = { area: name, survey: A.survey, lon: +lngLat.lng.toFixed(6), lat: +lngLat.lat.toFixed(6), v: 'unsure', note: '', at: new Date().toISOString() };
  A.mark = id; refreshMarks(); renderArea(name);
  try { await S.db.doc(`marks/${id}`).set(A.marks[id]); $('#asaved').textContent = 'Marked. Pick a verdict (keys 1-4).'; }
  catch (e) { delete A.marks[id]; A.mark = null; refreshMarks(); renderArea(name); $('#asaved').textContent = `Could not save (${e && e.message || 'error'}).`; }
}
async function setMark(id, patch) {
  const prev = A.marks[id]; if (!prev) return;
  A.marks[id] = { ...prev, ...patch, at: new Date().toISOString() }; refreshMarks(); renderArea(A.sel);
  try { await S.db.doc(`marks/${id}`).set(A.marks[id]); $('#asaved').textContent = 'Saved.'; }
  catch (e) { A.marks[id] = prev; refreshMarks(); renderArea(A.sel); $('#asaved').textContent = `Could not save (${e && e.message || 'error'}).`; }
}
async function dropMark(id) {
  const prev = A.marks[id]; delete A.marks[id]; A.mark = null; refreshMarks(); renderArea(A.sel);
  try { await S.db.doc(`marks/${id}`).delete(); }
  catch (e) { A.marks[id] = prev; refreshMarks(); renderArea(A.sel); $('#asaved').textContent = `Could not delete (${e && e.message || 'error'}).`; }
}
function selectMark(id, fly = false) {
  const m = A.marks[id]; if (!m) return;
  A.mark = id; refreshMarks(); renderArea(A.sel);
  if (fly) map.flyTo({ center: [m.lon, m.lat], zoom: 16, duration: 1500, padding: areaPad() });
}
map.on('click', e => {
  if (!A.sel || P.active || B.open) return;
  const hit = map.getLayer('amazon-marks') && map.queryRenderedFeatures(e.point, { layers: ['amazon-marks'] })[0];
  if (hit) return selectMark(hit.properties.id);
  if (!S.db) { const st = $('#asaved'); if (st) st.textContent = 'Marks need the Resurface server.'; return; }
  if (map.getZoom() < 13) { const st = $('#asaved'); if (st) st.textContent = 'Zoom in to the relief (zoom 13 or closer) to mark a spot.'; return; }
  addMark(A.sel, e.lngLat);
});
function renderArea(name) {
  const a = A.byName[name]; if (!a) return;
  const marks = areaMarks(name).sort((x, y) => x.at < y.at ? 1 : -1), cur = A.mark && A.marks[A.mark];
  const km2 = Math.round(a.surveys.reduce((t, v) => t + v.km2, 0)), seen = areaSeen(a);
  $('#body').innerHTML = `
    <button class="back" id="back">← Finder</button>
    <div><h2 class="site-title">${esc(a.label)}</h2><p class="site-aka">${esc(a.state)}, Brazil · ${a.surveys.length} LiDAR surveys, ${km2} km² · ${seen} looked at</p></div>
    ${cur ? `<div class="card">
      <p class="section-title">Mark · ${cur.lat.toFixed(5)}, ${cur.lon.toFixed(5)}</p>
      <div class="verdicts" role="group" aria-label="Verdict">${Object.entries(VERDICT).map(([k, l], i) => `<button data-mv="${k}" data-v="${k}" aria-pressed="${cur.v === k}" ${S.db ? '' : 'disabled'} title="Key ${i + 1}">${l}</button>`).join('')}</div>
      <textarea id="mnote" rows="2" placeholder="Note (what you see, why)" ${S.db ? '' : 'disabled'}>${esc(cur.note || '')}</textarea>
      <div class="tools"><button id="mdrop">Delete mark</button><button id="mclose">Done</button></div>
    </div>` : ''}
    <p class="status" id="asaved">${S.db ? 'Zoom in and click the relief to mark a spot.' : 'Marks need the Resurface server.'}</p>
    <div class="group">
      <p class="section-title">Surveys</p>
      <div class="tools"><button class="primary" id="anext">Next not looked at →</button>${A.survey ? `<button id="aseen">${A.seen[seenKey(name, A.survey)] ? 'Not looked at' : 'Looked at ✓'}</button>` : ''}</div>
      <ul class="known">${a.surveys.map(v => `<li><button class="linkish" data-sv="${esc(v.id)}" aria-current="${v.id === A.survey}">${esc(v.unit)} · ${v.year} · ${v.km2} km²</button>
        ${A.seen[seenKey(name, v.id)] ? '<span class="chip v-natural">Looked at</span>' : '<span class="chip todo">To look at</span>'}</li>`).join('')}</ul>
    </div>
    <div class="group">
      <p class="section-title">Marks (${marks.length})</p>
      <ul class="known">${marks.map(m => `<li><button class="linkish" data-mk="${esc(m.id)}" aria-current="${m.id === A.mark}">${m.lat.toFixed(4)}, ${m.lon.toFixed(4)}${m.survey ? ` · ${esc(m.survey)}` : ''}</button>
        <span class="chip v-${m.v}">${VERDICT[m.v]}</span>${m.note ? `<i>${esc(m.note)}</i>` : ''}</li>`).join('') || '<li class="status">No marks yet.</li>'}</ul>
    </div>
    <div class="about">
      <p>Bare-earth relief from the Brazilian Forest Service's forest-concession LiDAR, flown before selective logging, one block a year. Ditches and banks a few metres across show; hills are flattened. Logging roads, skid trails and log decks are recent; streams wander. A ring, square or straight bank that ignores the drainage is what to look for.</p>
      <p>${esc(a.credit)}. Private: this layer and its marks stay on this Mac and are never published.</p>
    </div>`;
  $('#back').onclick = () => { A.sel = null; A.mark = null; refreshMarks(); S.tab = 'finder'; renderList(); try { history.replaceState(null, '', '#finder'); } catch {} };

    $('#mnote').onchange = ev => setMark(A.mark, { note: ev.target.value.trim() });

    $('#mclose').onclick = () => { A.mark = null; refreshMarks(); renderArea(name); };
  }
}

/* ---------- boot ---------- */
async function boot() {
  const data = await fetch('data/sites.json').then(r => r.json());
  S.sites = data.sites; S.sites.forEach(s => S.byId[s.id] = s);
  if (!PUBLIC) await loadPlans();  // the plan pictures are the fit tool's; the public copy has neither
  if (!PUBLIC) F.scans = await fetch('data/scans.json').then(r => r.ok ? r.json() : { scans: [] }).then(d => d.scans).catch(() => []);
  F.scans.forEach(sc => F.byName[sc.name] = sc);
  if (!PUBLIC) A.areas = await fetch('data/amazon/areas.json').then(r => r.ok ? r.json() : { areas: [] }).then(d => d.areas).catch(() => []);
  A.areas.forEach(a => A.byName[a.name] = a);
  addMarkers();
  const start = () => {
    S.ready = true;
    applyAll();
    if (F.scans.length) addScanAreas();
    const id = location.hash.slice(1), m = id.match(/^scan-([\w-]+?)(?:\/(.+))?$/);
    if (id === 'finder') S.tab = 'finder';
    if (id.startsWith('c/')) loadCatalog().then(() => { if (C.byId[id.slice(2)] && location.hash === '#' + id) selectCat(id.slice(2)); }).catch(() => {});
    const am = id.match(/^amazon-([\w-]+)$/);
    if (am && A.byName[am[1]]) selectArea(am[1]);
    else if (S.byId[id]) select(id); else if (m && F.byName[m[1]]) selectScan(m[1], m[2]); else renderList();
  };
  if (S.mapLoaded) start(); else map.once('style.load', start);
  openDb().then(async db => {
    if (!db) return;
    if (!db.readOnly) S.db = db;  // S.db is the saving store: the owner tools show only with it
    try {
      const snap = await db.collection('plates').get();
      for (const doc of snap.docs) {
        const s = S.byId[doc.id], d = doc.data();
        if (s && s.plate) { S.align[s.id] = { dx: +d.dx || 0, dy: +d.dy || 0, rot: +d.rot || 0, scale: +d.scale || 1 }; moveplate(s); }
      }
    } catch {}
    try {
      const snap = await db.collection('depalign').get();
      for (const doc of snap.docs) { const d = doc.data(); S.depAlign[doc.id] = { dx: +d.dx || 0, dy: +d.dy || 0, rot: +d.rot || 0, scale: +d.scale || 1 }; }
      if (S.sel && S.byId[S.sel]) { applyDep(S.byId[S.sel]); if (!B.open) renderSite(S.byId[S.sel]); }
    } catch {}
    try {
      const snap = await db.collection('verdicts').get();
      for (const doc of snap.docs) { const v = doc.data(); if (VERDICT[v.v]) F.verdicts[doc.id] = { scan: v.scan, v: v.v }; }
      Object.keys(F.data).forEach(refreshCands);
    } catch {}
    try {
      for (const doc of (await db.collection('marks').get()).docs) A.marks[doc.id] = doc.data();
      for (const doc of (await db.collection('surveyseen').get()).docs) A.seen[doc.id] = doc.data();
      refreshMarks();
    } catch {}
    if (S.sel) { renderSite(S.byId[S.sel]); if (B.open) setTab(true); }
    else if (A.sel) renderArea(A.sel);
    else if (F.sel) renderScan(F.sel);
    else renderList();
  });
}
boot();
